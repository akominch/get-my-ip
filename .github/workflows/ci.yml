name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Unit tests
        run: swift test

      - name: Build app bundle
        run: ZIP=1 ./build.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: GetMyIP-${{ github.sha }}
          path: build/GetMyIP-*.zip
          retention-days: 14
